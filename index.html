<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جيو مساحة - المنصة التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <header class="bg-white shadow-sm p-4">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-blue-700">جيو مساحة</h1>
            <nav id="mainTabNav" class="flex gap-4 overflow-x-auto py-2 w-full md:w-auto">
                <!-- زر أكاديمية ArcGIS Pro -->
                <button data-tab="arcgis-academy" class="tab-btn whitespace-nowrap px-4 py-2.5 rounded-xl transition flex items-center gap-2 text-blue-700 bg-blue-50 border border-blue-200 hover:bg-blue-100 hover:text-slate-950 font-semibold shadow-sm">
                  <span>🗺️</span><span>أكاديمية ArcGIS Pro</span>
                  <span class="px-2 py-0.5 text-xs rounded-full bg-blue-200 text-blue-800 border border-blue-300">جديد</span>
                </button>

                <!-- زر محاكي الأجهزة المساحية -->
                <button data-tab="survey-simulator" class="tab-btn whitespace-nowrap px-4 py-2.5 rounded-xl transition flex items-center gap-2 text-orange-700 bg-orange-50 border border-orange-200 hover:bg-orange-100 hover:text-slate-950 font-semibold shadow-sm">
                  <span>🔭</span><span>محاكي الأجهزة المساحية</span>
                </button>
            </nav>
        </div>
    </header>
    <main class="container mx-auto mt-8 p-4">
        <div class="bg-white p-12 rounded-2xl shadow-sm border border-gray-100 text-center">
            <h2 class="text-2xl font-bold text-gray-800">مرحباً بك في منصة جيو مساحة التفاعلية</h2>
            <p class="mt-4 text-gray-500 text-lg">هذه الواجهة المبدئية للتحديث الجديد، اختر أحد الأقسام من الأعلى للبدء.</p>
        </div>
    </main>
</body>
</html>
